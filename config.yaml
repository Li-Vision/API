app:
  camera_index: 0
  window_name: "Li-Vision"
  run_mode: "inference"      # collect | train | inference

pipeline:
  model_path: "models/mediapipe/hand_landmarker.task"
  num_hands: 2

# ---------------------------------------------------
# CONFIGURAÇÃO DE DETECÇÃO
# ---------------------------------------------------
detection:
  mode: "rules"             # rules | ml | dynamic_ml | hybrid

  # parâmetros globais do DetectorManager
  min_score: 0.7
  stability_frames: 3
  # Tempo (s) que o gesto fica na tela apos detectado e depois de perder a
  # confianca. Em segundos porque o aparelho entrega ~3 frames/s.
  cooldown_seconds: 1.0
  hold_seconds: 0.5


# ---------------------------------------------------
# DETECTORES BASEADOS EM REGRAS
# ---------------------------------------------------
rules:
  enabled: false

  letters:
    - A
    - B
    - C
    - D
    - E


# ---------------------------------------------------
# ML ESTÁTICO (gestos sem movimento)
# ---------------------------------------------------
ml:
  enabled: true

  model_path: "models/static"

  confidence_threshold: 0.70


# ---------------------------------------------------
# ML DINÂMICO (gestos com movimento)
# ---------------------------------------------------
dynamic_ml:
  enabled: true

  model_path: "models/dynamic"

  confidence_threshold: 0.70

  window_size: 15

  # Movimento minimo da janela (ver holistic_features.window_motion) para o
  # dinamico classificar. 0 desliga. No dataset atual o menor valor medido e'
  # 0.0016 (SIM); ajuste com o log de inferencia (campo "motion").
  min_motion: 0.0015

  # Entrada da mao no quadro: o app nao envia frames sem mao, entao uma pausa
  # maior que reentry_gap_seconds entre frames conta como "a mao saiu e voltou".
  # Nessa volta o buffer e' limpo e os primeiros reentry_skip_frames frames sao
  # descartados, porque a chegada da mao passa do portao de movimento e o modelo
  # le a mao aberta como OI. 0 desliga.
  reentry_gap_seconds: 0.5
  reentry_skip_frames: 6


# ---------------------------------------------------
# ENTRADA HOLÍSTICA v2 (mãos + corpo + rosto)
# ---------------------------------------------------
# Canais opcionais usados pelos sinais completos de Libras. As mãos sempre
# são processadas; pose (corpo) e face (rosto) entram no vetor quando o
# cliente os envia. O subconjunto de pontos é fixado em
# src/data_collection/holistic_features.py (POSE_INDICES / FACE_INDICES) para
# manter a dimensionalidade controlada.
holistic:
  # Schema padrão para NOVAS coletas. O servidor ainda detecta automaticamente
  # holistic_v1 quando pose/face chegam no payload; este é apenas o rótulo base.
  default_feature_schema: "hands_v1"   # hands_v1 | holistic_v1

  pose:
    enabled: true                      # aceitar canal de corpo, se enviado
  face:
    enabled: true                      # aceitar canal de rosto, se enviado