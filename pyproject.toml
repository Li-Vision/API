[tool.ruff]
target-version = "py311"
extend-exclude = ["datasets", "models"]

[tool.ruff.lint]
# Apenas erros que quebram o código: sintaxe (E9), comparações/asserts
# inválidos (F63, F7) e nomes indefinidos (F82). Regras de estilo ficam de fora
# para não bloquear o CI com código legado.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
